version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "automated"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      test-sdk:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "NUnit*"
          - "FluentAssertions"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "automated"]
    commit-message:
      prefix: "chore(deps)"
