name: Build and Release QuickAi Plugin (Optimized)

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build and release (e.g. v1.3.0 or v1.3.1)'
        required: false
        default: ''
      version:
        description: 'Version without v prefix (e.g. 1.3.0 or 1.3.1)'
        required: false
        default: ''
      upload_release:
        description: 'Upload artifacts to GitHub Release'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v1.3.0)'
        required: false
        type: string
        default: ''
      version:
        description: 'Version without v prefix (e.g. 1.3.0)'
        required: false
        type: string
        default: ''
      upload_release:
        description: 'Upload artifacts to GitHub Release'
        required: false
        type: boolean
        default: true

# Permissions for GITHUB_TOKEN (principle of least privilege)
permissions:
  contents: write
  
# Prevent concurrent runs to avoid conflicts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag_name || github.event.release.tag_name || '' }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      matrix:
        platform: [x64, ARM64]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || (github.event_name == 'release' && github.event.release.tag_name) || github.ref }}
          fetch-depth: 1
          sparse-checkout: |
            QuickAi
            .github

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $inputVersion = "${{ inputs.version }}"
          $inputTag = "${{ inputs.tag_name }}"
          $eventTag = "${{ github.event.release.tag_name }}"
          
          if ($inputVersion) {
            $version = $inputVersion
          } elseif ($inputTag) {
            $version = $inputTag.TrimStart('v')
          } elseif ($eventTag) {
            $version = $eventTag.TrimStart('v')
          } elseif ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { 
            $version = $matches[1] 
          } else { 
            $version = "$(Get-Date -Format 'yyyy.MM.dd')-$($env:GITHUB_SHA.Substring(0,7))" 
          }
          
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "TAG_NAME=v$($version.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version: $version"

      - name: Build with optimizations
        shell: pwsh
        run: |
          $buildArgs = @(
            'QuickAi/QuickAi.sln',
            '-c', 'Release',
            '-p:Platform=${{ matrix.platform }}',
            '-p:UseSharedCompilation=false',
            '-p:BuildInParallel=true',
            '-p:ContinuousIntegrationBuild=true',
            '-p:Deterministic=true',
            '-p:DebugType=none',
            '-p:DebugSymbols=false',
            '--nologo',
            '-v:minimal'
          )
          dotnet build @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare artifacts (optimized)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.VERSION }}'
          $platform = '${{ matrix.platform }}'
          
          $buildPath = "QuickAi/Community.PowerToys.Run.Plugin.QuickAi/bin/$platform/Release/net9.0-windows10.0.22621.0"
          $artifactPath = "artifacts/QuickAi-v$version-$platform/QuickAi"
          $zipPath = "artifacts/QuickAi-$version-$platform.zip"
          
          [void](New-Item -ItemType Directory -Force -Path $artifactPath)
          
          robocopy "$buildPath" "$artifactPath" /E /NFL /NDL /NJH /NJS /NC /NS /NP
          if ($LASTEXITCODE -ge 8) {
            Write-Error "Robocopy failed with exit code $LASTEXITCODE"
            exit 1
          }
          $LASTEXITCODE = 0
          
          $filesToRemove = @(
            'PowerToys.Common.UI.dll', 'PowerToys.Common.UI.pdb',
            'PowerToys.ManagedCommon.dll', 'PowerToys.ManagedCommon.pdb',
            'PowerToys.Settings.UI.Lib.dll', 'PowerToys.Settings.UI.Lib.pdb',
            'Wox.Infrastructure.dll', 'Wox.Infrastructure.pdb',
            'Wox.Plugin.dll', 'Wox.Plugin.pdb'
          )
          
          foreach ($file in $filesToRemove) {
            $filePath = Join-Path $artifactPath $file
            if (Test-Path $filePath -PathType Leaf) {
              [System.IO.File]::Delete($filePath)
            }
          }
          
          Add-Type -Assembly System.IO.Compression.FileSystem
          $compressionLevel = [System.IO.Compression.CompressionLevel]::Optimal
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path "artifacts/QuickAi-v$version-$platform").Path,
            (Join-Path (Get-Location) $zipPath),
            $compressionLevel,
            $false
          )

          Write-Host "✓ Created $zipPath"
          exit 0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quickai-${{ matrix.platform }}
          path: artifacts/*.zip
          retention-days: 7
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      always() &&
      needs.build.result == 'success' &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'release' ||
        (github.event_name == 'workflow_call' && (inputs.upload_release == true || inputs.upload_release == 'true')) ||
        (github.event_name == 'workflow_dispatch' && (inputs.upload_release == true || inputs.upload_release == 'true'))
      )

    steps:
      - name: Checkout (minimal)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || (github.event_name == 'release' && github.event.release.tag_name) || github.ref }}
          fetch-depth: 1
          sparse-checkout: |
            README.md
            assets

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
            VERSION="${TAG#v}"
          elif [ "${{ github.event_name }}" = "release" ] && [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(date +'%Y.%m.%d')-$(echo $GITHUB_SHA | cut -c1-7)"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release assets
        run: |
          set -e
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p release
          
          if [ -f "artifacts/QuickAi-${VERSION}-x64.zip" ]; then
            cp "artifacts/QuickAi-${VERSION}-x64.zip" release/
            sha256sum "release/QuickAi-${VERSION}-x64.zip" | awk '{print toupper($1) "  " $2}' > "release/QuickAi-${VERSION}-x64.zip.sha256"
          fi
          
          if [ -f "artifacts/QuickAi-${VERSION}-ARM64.zip" ]; then
            cp "artifacts/QuickAi-${VERSION}-ARM64.zip" release/
            sha256sum "release/QuickAi-${VERSION}-ARM64.zip" | awk '{print toupper($1) "  " $2}' > "release/QuickAi-${VERSION}-ARM64.zip.sha256"
          fi
          
          {
            echo "SHA256 Checksums for QuickAi Plugin v${VERSION}"
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            cat release/*.sha256 2>/dev/null || true
          } > release/checksums.txt
          
          ls -lh release/

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.TAG_NAME }}"
          echo "Uploading assets to release $TAG..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "QuickAi $TAG" --generate-notes
          fi
